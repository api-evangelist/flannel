aid: flannel
name: Flannel
description: >-
  Flannel is a simple overlay network that satisfies the Kubernetes networking
  requirements. It runs a small single binary agent called flanneld on each
  host and is responsible for allocating a subnet lease to each host out of a
  larger preconfigured address space. Flannel does not expose its own
  HTTP/REST API; it stores network configuration in either the Kubernetes API
  or etcd directly and is managed via configuration files, kubectl, and Helm.
