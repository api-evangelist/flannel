  - aid: flannel:flannel
    name: Flannel
    description: >-
      Flannel is a simple overlay network that satisfies the Kubernetes
      networking requirements. It allocates subnet leases to each host and
      provides a layer 3 IPv4 network between multiple nodes in a cluster. It
      is configured via the Kubernetes API or etcd and exposes no REST API of
      its own.
